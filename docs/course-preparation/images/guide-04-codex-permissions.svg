<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Codex 工作目录、沙盒与审批设置的关系</title>
  <desc id="desc">工作目录决定本次查看哪里，Sandbox 的 read-only 决定不能修改工作区，Approval 的 on-request 决定需要时先询问，最后用状态命令复查。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#eef8ff"/><stop offset="1" stop-color="#f5f2ff"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#4c6fba"/></marker><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity=".13"/></filter></defs>
  <rect width="1200" height="460" rx="28" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Source Han Sans SC, Noto Sans CJK SC, WenQuanYi Micro Hei, sans-serif" font-size="28" font-weight="700" fill="#253451">三个设置各管一件事，第一次同时把它们看清</text>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle">
    <g filter="url(#s)"><rect x="55" y="120" width="205" height="230" rx="25" fill="#fff"/><rect x="108" y="159" width="99" height="76" rx="14" fill="#dff0ff"/><path d="M126 178h62v44h-62zM138 166h21l9 12h-30z" fill="none" stroke="#3972ad" stroke-width="5"/><text x="157" y="280" font-size="22" font-weight="700" fill="#27354f">1. 工作目录</text><text x="157" y="309" font-size="18" fill="#4f5e78">agent-sandbox</text><text x="157" y="334" font-size="17" fill="#677389">本次从哪里开始看</text></g>
    <g filter="url(#s)"><rect x="345" y="120" width="205" height="230" rx="25" fill="#fff"/><circle cx="447" cy="197" r="40" fill="#eee8ff"/><path d="M424 195v-9a23 23 0 0 1 46 0v9m-53 0h60v39h-60z" fill="none" stroke="#7157bd" stroke-width="6"/><text x="447" y="280" font-size="22" font-weight="700" fill="#27354f">2. Sandbox</text><text x="447" y="309" font-size="18" fill="#4f5e78">read-only</text><text x="447" y="334" font-size="17" fill="#677389">不能修改工作区文件</text></g>
    <g filter="url(#s)"><rect x="635" y="120" width="205" height="230" rx="25" fill="#fff"/><circle cx="737" cy="197" r="40" fill="#e0f5eb"/><path d="M717 202l14 14 30-37" fill="none" stroke="#3a8a65" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><text x="737" y="280" font-size="22" font-weight="700" fill="#27354f">3. Approval</text><text x="737" y="309" font-size="18" fill="#4f5e78">on-request</text><text x="737" y="334" font-size="17" fill="#677389">需要时先停下来问你</text></g>
    <g filter="url(#s)"><rect x="925" y="120" width="220" height="230" rx="25" fill="#fff"/><circle cx="1035" cy="197" r="40" fill="#fff0dd"/><path d="M1013 176h44v44h-44zm9 13h26m-26 12h19" fill="none" stroke="#bc7828" stroke-width="5" stroke-linecap="round"/><text x="1035" y="280" font-size="22" font-weight="700" fill="#27354f">4. 会话复查</text><text x="1035" y="309" font-size="18" fill="#4f5e78">/status</text><text x="1035" y="334" font-size="17" fill="#677389">/permissions</text></g>
  </g>
  <g font-family="Microsoft YaHei, PingFang SC, Source Han Sans SC, Noto Sans CJK SC, WenQuanYi Micro Hei, sans-serif" text-anchor="middle" font-size="34" font-weight="700" fill="#4c6fba"><text x="302" y="247">+</text><text x="592" y="247">+</text><text x="882" y="247">→</text></g>
  <rect x="145" y="388" width="910" height="44" rx="22" fill="#4c6fba"/><text x="600" y="417" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Source Han Sans SC, Noto Sans CJK SC, WenQuanYi Micro Hei, sans-serif" font-size="18" fill="#fff">三项同时生效；首次练习确认“目录正确 + Read Only”就已经成功。</text>
</svg>
