<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">导入课程 Ubuntu 虚拟机的六个步骤</title>
  <desc id="desc">从完整课程虚拟机目录开始，复制到本机 SSD，打开 VMX，检查资源和 NAT，选择已复制，最后登录 Ubuntu。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f2f7ff"/><stop offset="1" stop-color="#fff6ee"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#5279c9"/></marker><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".13"/></filter></defs>
  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#25324a">课程主线：打开一台已经准备好的 Ubuntu 虚拟机</text>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle" filter="url(#s)">
    <g><rect x="30" y="112" width="165" height="205" rx="22" fill="#fff"/><circle cx="62" cy="145" r="19" fill="#5279c9"/><text x="62" y="152" font-size="19" font-weight="700" fill="#fff">1</text><path d="M74 187h77v57H74z" fill="#dce9ff" stroke="#5279c9" stroke-width="4"/><path d="M84 177h30l10 10H84z" fill="#92b6ef"/><text x="112" y="275" font-size="20" font-weight="700" fill="#27334c">认全文件</text><text x="112" y="301" font-size="15" fill="#6d7482">VMX + 全部 VMDK</text></g>
    <g><rect x="225" y="112" width="165" height="205" rx="22" fill="#fff"/><circle cx="257" cy="145" r="19" fill="#5279c9"/><text x="257" y="152" font-size="19" font-weight="700" fill="#fff">2</text><rect x="271" y="179" width="72" height="60" rx="8" fill="#e8f8ee" stroke="#3b9b67" stroke-width="4"/><path d="M281 211h52" stroke="#3b9b67" stroke-width="5"/><text x="307" y="275" font-size="20" font-weight="700" fill="#27334c">复制到 SSD</text><text x="307" y="301" font-size="15" fill="#6d7482">不在资料原目录运行</text></g>
    <g><rect x="420" y="112" width="165" height="205" rx="22" fill="#fff"/><circle cx="452" cy="145" r="19" fill="#5279c9"/><text x="452" y="152" font-size="19" font-weight="700" fill="#fff">3</text><rect x="466" y="179" width="72" height="60" rx="7" fill="#fff0df" stroke="#e68a32" stroke-width="4"/><text x="502" y="216" font-size="19" font-weight="700" fill="#c36c1d">.vmx</text><text x="502" y="275" font-size="20" font-weight="700" fill="#27334c">File → Open</text><text x="502" y="301" font-size="15" fill="#6d7482">选择主配置文件</text></g>
    <g><rect x="615" y="112" width="165" height="205" rx="22" fill="#fff"/><circle cx="647" cy="145" r="19" fill="#5279c9"/><text x="647" y="152" font-size="19" font-weight="700" fill="#fff">4</text><path d="M658 189h73m-73 22h73m-73 22h73" stroke="#765bc0" stroke-width="6" stroke-linecap="round"/><circle cx="686" cy="189" r="8" fill="#fff" stroke="#765bc0" stroke-width="4"/><circle cx="714" cy="211" r="8" fill="#fff" stroke="#765bc0" stroke-width="4"/><circle cx="676" cy="233" r="8" fill="#fff" stroke="#765bc0" stroke-width="4"/><text x="697" y="270" font-size="20" font-weight="700" fill="#27334c">检查设置</text><text x="697" y="294" font-size="14" fill="#6d7482">CPU / 内存 / 磁盘</text><text x="697" y="313" font-size="14" fill="#6d7482">网络 NAT</text></g>
    <g><rect x="810" y="112" width="165" height="205" rx="22" fill="#fff"/><circle cx="842" cy="145" r="19" fill="#5279c9"/><text x="842" y="152" font-size="19" font-weight="700" fill="#fff">5</text><rect x="850" y="179" width="86" height="60" rx="10" fill="#ede8ff" stroke="#765bc0" stroke-width="4"/><path d="M871 211l13 13 29-33" fill="none" stroke="#765bc0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="892" y="275" font-size="20" font-weight="700" fill="#27334c">选择“已复制”</text><text x="892" y="301" font-size="15" fill="#6d7482">生成新的 UUID / MAC</text></g>
    <g><rect x="1005" y="112" width="165" height="205" rx="22" fill="#fff"/><circle cx="1037" cy="145" r="19" fill="#5279c9"/><text x="1037" y="152" font-size="19" font-weight="700" fill="#fff">6</text><circle cx="1087" cy="199" r="33" fill="#f0e3f3"/><path d="M1068 218c5-15 33-15 38 0M1087 185a10 10 0 1 0 0 .1" fill="none" stroke="#6c3f77" stroke-width="5" stroke-linecap="round"/><text x="1087" y="275" font-size="20" font-weight="700" fill="#27334c">启动并登录</text><text x="1087" y="301" font-size="15" fill="#6d7482">看到 Ubuntu 桌面</text></g>
  </g>
  <g stroke="#5279c9" stroke-width="4" marker-end="url(#a)"><path d="M197 214h20"/><path d="M392 214h20"/><path d="M587 214h20"/><path d="M782 214h20"/><path d="M977 214h20"/></g>
  <rect x="180" y="352" width="840" height="48" rx="24" fill="#fff"/><text x="600" y="383" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#4c5870">关键点：复制的是“整台虚拟机的文件夹”，不是只拿一个磁盘文件。</text>
</svg>
