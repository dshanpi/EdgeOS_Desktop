<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code 第一次安全上手流程</title>
  <desc id="desc">依次完成安装检查、浏览器登录、进入练习目录、计划模式只读提问和退出。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fff8f0"/><stop offset="1" stop-color="#f7f2ff"/></linearGradient><marker id="a" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0 0l11 5.5L0 11z" fill="#a25f3b"/></marker><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".12"/></filter></defs>
  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#3d2d32">第一次只在“练习房间”里让 Claude Code 看一看</text>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle">
    <g filter="url(#s)"><rect x="52" y="115" width="190" height="205" rx="24" fill="#fff"/><circle cx="147" cy="177" r="39" fill="#f7dfcf"/><path d="M124 177h46m-23-23v46" stroke="#a25f3b" stroke-width="7" stroke-linecap="round"/><text x="147" y="258" font-size="21" font-weight="700" fill="#3b3036">安装并验版本</text><text x="147" y="288" font-size="16" fill="#746970">claude --version</text></g>
    <g filter="url(#s)"><rect x="280" y="115" width="190" height="205" rx="24" fill="#fff"/><circle cx="375" cy="177" r="39" fill="#eadff7"/><path d="M352 180c5 26 41 26 46 0m-35-8a5 5 0 1 0 0 .1m24-.1a5 5 0 1 0 0 .1" fill="none" stroke="#76538f" stroke-width="5" stroke-linecap="round"/><text x="375" y="258" font-size="21" font-weight="700" fill="#3b3036">完成浏览器登录</text><text x="375" y="288" font-size="16" fill="#746970">claude auth status</text></g>
    <g filter="url(#s)"><rect x="508" y="115" width="190" height="205" rx="24" fill="#fff"/><circle cx="603" cy="177" r="39" fill="#dfeefc"/><path d="M576 161h54v41h-54zM586 151h20l8 10h-28z" fill="none" stroke="#4979aa" stroke-width="5" stroke-linejoin="round"/><text x="603" y="258" font-size="21" font-weight="700" fill="#3b3036">进入练习目录</text><text x="603" y="288" font-size="16" fill="#746970">agent-sandbox</text></g>
    <g filter="url(#s)"><rect x="736" y="115" width="190" height="205" rx="24" fill="#fff"/><circle cx="831" cy="177" r="39" fill="#e2f5ea"/><path d="M808 161h46v34h-28l-13 10v-10h-5z" fill="none" stroke="#438263" stroke-width="5" stroke-linejoin="round"/><text x="831" y="258" font-size="21" font-weight="700" fill="#3b3036">Plan 模式提问</text><text x="831" y="288" font-size="16" fill="#746970">先分析，不改文件</text></g>
    <g filter="url(#s)"><rect x="964" y="115" width="190" height="205" rx="24" fill="#fff"/><circle cx="1059" cy="177" r="39" fill="#fff0d9"/><path d="M1041 158h31v38h-31m10-19h34m-12-12l12 12-12 12" fill="none" stroke="#bf7b28" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="1059" y="258" font-size="21" font-weight="700" fill="#3b3036">确认结果并退出</text><text x="1059" y="288" font-size="16" fill="#746970">需要时 Ctrl+C，再 /exit</text></g>
  </g>
  <g stroke="#a25f3b" stroke-width="4" marker-end="url(#a)"><path d="M246 216h26"/><path d="M474 216h26"/><path d="M702 216h26"/><path d="M930 216h26"/></g>
  <rect x="210" y="352" width="780" height="46" rx="23" fill="#fff"/><text x="600" y="382" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#5d5057">练习目录里只有测试文件，即使点错也不会碰到真正的 SDK。</text>
</svg>
