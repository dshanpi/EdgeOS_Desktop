<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">AI 工具的三类钥匙互不通用</title>
  <desc id="desc">Claude 与 Codex 各自登录；这类命令行登录、DeepSeek Harness 的模型设置、Docs-AIAgent 的 env 文件是三类独立认证。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fffaf1"/><stop offset="1" stop-color="#f2f4ff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity=".14"/></filter></defs>
  <rect width="1200" height="500" rx="28" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Source Han Sans SC, Noto Sans CJK SC, WenQuanYi Micro Hei, sans-serif" font-size="28" font-weight="700" fill="#2e3148">三类钥匙，分别开三类门</text>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle">
    <g filter="url(#s)"><rect x="55" y="105" width="330" height="305" rx="26" fill="#fff"/><circle cx="220" cy="175" r="48" fill="#f9e0cb"/><circle cx="202" cy="175" r="15" fill="none" stroke="#a86139" stroke-width="7"/><path d="M217 175h61m-20 0v18m-18-18v13" stroke="#a86139" stroke-width="7" stroke-linecap="round"/><text x="220" y="257" font-size="23" font-weight="700" fill="#33354a">A 类：CLI 各自登录</text><text x="220" y="292" font-size="18" fill="#555b72">Claude 与 Codex 各有一把</text><text x="220" y="325" font-size="17" fill="#555b72">账号与凭据互不共用</text><text x="220" y="354" font-size="17" fill="#555b72">也不会自动传给项目</text></g>
    <g filter="url(#s)"><rect x="435" y="105" width="330" height="305" rx="26" fill="#fff"/><circle cx="600" cy="175" r="48" fill="#e4f5ed"/><circle cx="582" cy="175" r="15" fill="none" stroke="#3a8a66" stroke-width="7"/><path d="M597 175h61m-20 0v18m-18-18v13" stroke="#3a8a66" stroke-width="7" stroke-linecap="round"/><text x="600" y="257" font-size="23" font-weight="700" fill="#33354a">B 类：Harness 模型</text><text x="600" y="292" font-size="18" fill="#555b72">Settings → Models</text><text x="600" y="325" font-size="17" fill="#555b72">保存在 Harness 自己的状态中</text><text x="600" y="354" font-size="17" fill="#555b72">不会自动传给项目</text></g>
    <g filter="url(#s)"><rect x="815" y="105" width="330" height="305" rx="26" fill="#fff"/><circle cx="980" cy="175" r="48" fill="#e9e5fb"/><circle cx="962" cy="175" r="15" fill="none" stroke="#6653ad" stroke-width="7"/><path d="M977 175h61m-20 0v18m-18-18v13" stroke="#6653ad" stroke-width="7" stroke-linecap="round"/><text x="980" y="257" font-size="23" font-weight="700" fill="#33354a">C 类：项目 API Key</text><text x="980" y="292" font-size="18" fill="#555b72">Docs-AIAgent/.env</text><text x="980" y="325" font-size="17" fill="#555b72">只给当前项目进程读取</text><text x="980" y="354" font-size="17" fill="#555b72">不能提交到 Git</text></g>
  </g>
  <g font-family="Microsoft YaHei, PingFang SC, Source Han Sans SC, Noto Sans CJK SC, WenQuanYi Micro Hei, sans-serif" text-anchor="middle" font-size="44" font-weight="700" fill="#d55757"><text x="410" y="235">≠</text><text x="790" y="235">≠</text></g>
  <rect x="230" y="438" width="740" height="42" rx="21" fill="#343852"/><text x="600" y="466" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Source Han Sans SC, Noto Sans CJK SC, WenQuanYi Micro Hei, sans-serif" font-size="18" fill="#fff">一种配置成功 ≠ 其他工具也有 Key；每套配置都要单独验收。</text>
</svg>
