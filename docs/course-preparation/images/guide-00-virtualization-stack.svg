<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">从硬件虚拟化到 Ubuntu 的五层关系</title>
  <desc id="desc">从左到右依次是 CPU 和 BIOS、Windows、VMware、Ubuntu 虚拟机以及课程开发工具。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f4ff"/><stop offset="1" stop-color="#fff8ef"/></linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#37295c" flood-opacity=".14"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#7c5ce7"/></marker>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <text x="600" y="54" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#29233f">把虚拟机想成一套“层层托住”的积木</text>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle">
    <g filter="url(#shadow)"><rect x="45" y="120" width="190" height="190" rx="24" fill="#fff"/><circle cx="140" cy="180" r="34" fill="#e8e2ff"/><path d="M120 180h40M140 160v40" stroke="#6b4fd3" stroke-width="8" stroke-linecap="round"/><text x="140" y="246" font-size="23" font-weight="700" fill="#30284b">CPU + BIOS</text><text x="140" y="278" font-size="17" fill="#6a637d">打开 VT-x / AMD-V</text></g>
    <g filter="url(#shadow)"><rect x="275" y="120" width="190" height="190" rx="24" fill="#fff"/><rect x="328" y="148" width="84" height="70" rx="8" fill="#d9ebff" stroke="#3c79b8" stroke-width="4"/><path d="M370 218v18m-28 0h56" stroke="#3c79b8" stroke-width="5" stroke-linecap="round"/><text x="370" y="266" font-size="23" font-weight="700" fill="#30284b">Windows</text><text x="370" y="294" font-size="17" fill="#6a637d">真实电脑的系统</text></g>
    <g filter="url(#shadow)"><rect x="505" y="120" width="190" height="190" rx="24" fill="#fff"/><rect x="548" y="147" width="104" height="78" rx="14" fill="#ffe2c8"/><path d="M570 205l30-38 30 38z" fill="none" stroke="#ef7b2d" stroke-width="7" stroke-linejoin="round"/><text x="600" y="266" font-size="23" font-weight="700" fill="#30284b">VMware</text><text x="600" y="294" font-size="17" fill="#6a637d">虚拟电脑的“机箱”</text></g>
    <g filter="url(#shadow)"><rect x="735" y="120" width="190" height="190" rx="24" fill="#fff"/><circle cx="830" cy="184" r="39" fill="#5b235d"/><circle cx="830" cy="184" r="12" fill="#fff"/><circle cx="830" cy="151" r="8" fill="#f49b53"/><circle cx="859" cy="200" r="8" fill="#f49b53"/><circle cx="801" cy="200" r="8" fill="#f49b53"/><text x="830" y="266" font-size="23" font-weight="700" fill="#30284b">Ubuntu 24.04</text><text x="830" y="294" font-size="17" fill="#6a637d">虚拟机里的 Linux</text></g>
    <g filter="url(#shadow)"><rect x="965" y="120" width="190" height="190" rx="24" fill="#fff"/><rect x="1012" y="151" width="96" height="70" rx="10" fill="#ddf7ec" stroke="#31956f" stroke-width="4"/><path d="M1029 174l13 12-13 12m27 0h28" fill="none" stroke="#25805f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="1060" y="266" font-size="23" font-weight="700" fill="#30284b">课程工具</text><text x="1060" y="294" font-size="17" fill="#6a637d">SDK、Node、Agent</text></g>
  </g>
  <g stroke="#7c5ce7" stroke-width="5" fill="none" marker-end="url(#arrow)"><path d="M237 215h30"/><path d="M467 215h30"/><path d="M697 215h30"/><path d="M927 215h30"/></g>
  <rect x="175" y="347" width="850" height="44" rx="22" fill="#fff" opacity=".92"/><text x="600" y="376" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Source Han Sans SC, Noto Sans CJK SC, WenQuanYi Micro Hei, sans-serif" font-size="19" fill="#514967">前一层正常，后一层才站得稳；本节确认前两层，再装好 VMware。</text>
</svg>
