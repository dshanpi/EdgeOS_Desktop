<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Agent 辅助排错的六个关键阶段</title>
  <desc id="desc">稳定复现、保存日志和退出码、从首错判断故障层、只读收集证据并验证假设、人工批准最小修改并看差异、完成三层验证。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fff7f3"/><stop offset="1" stop-color="#f1f7ff"/></linearGradient><marker id="a" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0 0l11 5.5L0 11z" fill="#7359bd"/></marker><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".13"/></filter></defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#302c49">排错不是“多试几个办法”，而是一次只验证一件事</text>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle">
    <g filter="url(#s)"><circle cx="205" cy="175" r="76" fill="#fff"/><circle cx="205" cy="145" r="26" fill="#ffe3d6"/><text x="205" y="154" font-size="26" font-weight="700" fill="#b85a37">1</text><text x="205" y="203" font-size="20" font-weight="700" fill="#343047">稳定复现</text><text x="205" y="229" font-size="17" fill="#6e697d">保留原命令与环境</text></g>
    <g filter="url(#s)"><circle cx="500" cy="175" r="76" fill="#fff"/><circle cx="500" cy="145" r="26" fill="#e4efff"/><text x="500" y="154" font-size="26" font-weight="700" fill="#4778b0">2</text><text x="500" y="203" font-size="20" font-weight="700" fill="#343047">保存完整日志</text><text x="500" y="229" font-size="17" fill="#6e697d">日志 + 退出码</text></g>
    <g filter="url(#s)"><circle cx="795" cy="175" r="76" fill="#fff"/><circle cx="795" cy="145" r="26" fill="#fff0d6"/><text x="795" y="154" font-size="26" font-weight="700" fill="#b77b29">3</text><text x="795" y="203" font-size="20" font-weight="700" fill="#343047">找首错并分层</text><text x="795" y="229" font-size="17" fill="#6e697d">判断故障在哪一层</text></g>
    <g filter="url(#s)"><circle cx="995" cy="390" r="76" fill="#fff"/><circle cx="995" cy="360" r="26" fill="#e8e3fb"/><text x="995" y="369" font-size="26" font-weight="700" fill="#6751ad">4</text><text x="995" y="418" font-size="20" font-weight="700" fill="#343047">只读收集证据</text><text x="995" y="444" font-size="16" fill="#6e697d">证据 → 一个假设</text></g>
    <g filter="url(#s)"><circle cx="650" cy="390" r="76" fill="#fff"/><circle cx="650" cy="360" r="26" fill="#e1f5eb"/><text x="650" y="369" font-size="26" font-weight="700" fill="#3c8964">5</text><text x="650" y="418" font-size="20" font-weight="700" fill="#343047">人工批准小改动</text><text x="650" y="444" font-size="17" fill="#6e697d">改后看 diff，可回滚</text></g>
    <g filter="url(#s)"><circle cx="305" cy="390" r="76" fill="#fff"/><circle cx="305" cy="360" r="26" fill="#dff2f7"/><text x="305" y="369" font-size="26" font-weight="700" fill="#397f91">6</text><text x="305" y="418" font-size="20" font-weight="700" fill="#343047">三层验证</text><text x="305" y="444" font-size="17" fill="#6e697d">原命令 / 定向 / 回归</text></g>
  </g>
  <g stroke="#7359bd" stroke-width="5" fill="none" marker-end="url(#a)"><path d="M289 175h123"/><path d="M584 175h123"/><path d="M862 218c55 20 100 62 119 92"/><path d="M909 390H738"/><path d="M564 390H393"/><path d="M243 340C171 310 165 276 205 252"/></g>
  <rect x="395" y="496" width="410" height="42" rx="21" fill="#3b3756"/><text x="600" y="523" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" fill="#fff">验证失败？带着新证据回到第 1 步。</text>
</svg>
