<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek Harness 的运行关系</title>
  <desc id="desc">终端启动本地服务和浏览器操作台，操作台分别连接模型服务与练习工作区，只读权限约束对工作区文件的操作。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#eefbf8"/><stop offset="1" stop-color="#f4f1ff"/></linearGradient><marker id="a" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0 0l11 5.5L0 11z" fill="#3a8d79"/></marker><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity=".13"/></filter></defs>
  <rect width="1200" height="500" rx="28" fill="url(#bg)"/>
  <text x="600" y="50" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#243f42">Harness = 终端里的小服务器 + 浏览器里的操作台</text>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" text-anchor="middle">
    <g filter="url(#s)"><rect x="55" y="135" width="240" height="230" rx="25" fill="#fff"/><rect x="102" y="172" width="146" height="92" rx="12" fill="#26333c"/><path d="M121 202l15 14-15 14m29 0h55" fill="none" stroke="#73e0bd" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="175" y="307" font-size="22" font-weight="700" fill="#273b42">1. Ubuntu 终端</text><text x="175" y="336" font-size="16" fill="#65767a">运行 dsh，窗口别关</text></g>
    <g filter="url(#s)"><rect x="365" y="135" width="240" height="230" rx="25" fill="#fff"/><rect x="411" y="171" width="148" height="96" rx="12" fill="#e6f4ff" stroke="#4b86b7" stroke-width="4"/><path d="M411 195h148M430 184h5m12 0h5m12 0h5" stroke="#4b86b7" stroke-width="4" stroke-linecap="round"/><text x="485" y="307" font-size="22" font-weight="700" fill="#273b42">2. 浏览器 Web UI</text><text x="485" y="336" font-size="16" fill="#65767a">127.0.0.1:3080</text></g>
    <g filter="url(#s)"><rect x="675" y="90" width="240" height="185" rx="25" fill="#fff"/><circle cx="795" cy="151" r="34" fill="#eee9ff"/><path d="M778 151h34m-17-17v34" stroke="#715bc1" stroke-width="6" stroke-linecap="round"/><text x="795" y="220" font-size="22" font-weight="700" fill="#273b42">3. 模型 Provider</text><text x="795" y="248" font-size="16" fill="#65767a">在 Settings → Models 配置</text></g>
    <g filter="url(#s)"><rect x="675" y="310" width="240" height="150" rx="25" fill="#fff"/><path d="M738 347h114v58H738zM754 337h36l13 10h-49z" fill="#e4f7ee" stroke="#3f9070" stroke-width="4"/><text x="795" y="434" font-size="21" font-weight="700" fill="#273b42">4. 练习工作区</text></g>
    <g filter="url(#s)"><rect x="985" y="310" width="160" height="150" rx="25" fill="#fff"/><circle cx="1065" cy="354" r="28" fill="#def4ec"/><path d="M1050 356l10 10 22-27" fill="none" stroke="#348568" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="1065" y="411" font-size="18" font-weight="700" fill="#273b42">权限状态</text><text x="1065" y="438" font-size="18" fill="#348568">Read Only</text></g>
  </g>
  <g stroke="#3a8d79" stroke-width="5" fill="none" marker-end="url(#a)"><path d="M302 250h51"/><path d="M612 220c25-25 34-45 51-50"/><path d="M612 280c25 26 34 82 51 95"/><path d="M985 385h-58"/></g>
  <rect x="205" y="432" width="400" height="42" rx="21" fill="#fff7df"/><text x="405" y="459" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" fill="#825f20">按 Ctrl+C 可以停止本地服务。</text>
</svg>
