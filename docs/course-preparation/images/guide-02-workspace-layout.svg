<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">课程文件从 Windows 手动复制到 Ubuntu 工作区</title>
  <desc id="desc">在 Windows 资源管理器与 Ubuntu 文件管理器之间手动拖放文件，直接放入 Ubuntu 本地的五个课程目录。</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#f9f3ff"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#6a5bd2"/></marker><filter id="s"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity=".14"/></filter></defs>
  <rect width="1200" height="500" rx="28" fill="url(#bg)"/>
  <text x="600" y="50" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="28" font-weight="700" fill="#2d2a45">手动把资料拖进 Ubuntu，本地目录就是“工作台”</text>
  <g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <g filter="url(#s)"><rect x="45" y="125" width="250" height="250" rx="26" fill="#fff"/><rect x="105" y="163" width="130" height="90" rx="10" fill="#dcecff" stroke="#477ebd" stroke-width="4"/><path d="M170 253v24m-43 0h86" stroke="#477ebd" stroke-width="6" stroke-linecap="round"/><text x="170" y="316" text-anchor="middle" font-size="23" font-weight="700" fill="#29344b">Windows 课程资料</text><text x="170" y="347" text-anchor="middle" font-size="17" fill="#697286">原始包保持不动</text></g>
    <g filter="url(#s)"><rect x="395" y="125" width="250" height="250" rx="26" fill="#fff"/><rect x="457" y="168" width="126" height="84" rx="12" fill="#fff0dc" stroke="#e6892f" stroke-width="4"/><path d="M475 210h82m-20-20 20 20-20 20" fill="none" stroke="#e6892f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="520" y="301" text-anchor="middle" font-size="23" font-weight="700" fill="#29344b">手动拖放复制</text><text x="520" y="331" text-anchor="middle" font-size="17" fill="#697286">Windows → Ubuntu</text><text x="520" y="356" text-anchor="middle" font-size="16" fill="#c46b19">等待进度完成</text></g>
    <g filter="url(#s)"><rect x="745" y="90" width="410" height="330" rx="26" fill="#fff"/><text x="950" y="133" text-anchor="middle" font-size="23" font-weight="700" fill="#29344b">~/100ask-course（Ubuntu 本地 ext4）</text><g font-size="18"><rect x="785" y="164" width="150" height="58" rx="14" fill="#e3efff"/><text x="860" y="200" text-anchor="middle" fill="#355f99">incoming</text><rect x="965" y="164" width="150" height="58" rx="14" fill="#e8e4ff"/><text x="1040" y="200" text-anchor="middle" fill="#5d4eaa">sdk</text><rect x="785" y="245" width="150" height="58" rx="14" fill="#e1f6ec"/><text x="860" y="281" text-anchor="middle" fill="#2f7d5c">projects</text><rect x="965" y="245" width="150" height="58" rx="14" fill="#fff0dc"/><text x="1040" y="281" text-anchor="middle" fill="#a8601f">tools</text><rect x="875" y="326" width="150" height="58" rx="14" fill="#f7e5ef"/><text x="950" y="362" text-anchor="middle" fill="#98506f">logs</text></g></g>
    <path d="M305 250h78" stroke="#6a5bd2" stroke-width="6" marker-end="url(#a)"/><path d="M655 250h78" stroke="#6a5bd2" stroke-width="6" marker-end="url(#a)"/>
    <text x="345" y="205" text-anchor="middle" font-size="18" font-weight="700" fill="#4f4869">选中文件</text><text x="695" y="205" text-anchor="middle" font-size="18" font-weight="700" fill="#4f4869">放入目录</text>
  </g>
  <rect x="185" y="445" width="830" height="38" rx="19" fill="#5749bd"/><text x="600" y="470" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" fill="#fff">不配置共享目录；SDK 和工程复制完成后，只在 Ubuntu 本地处理。</text>
</svg>
