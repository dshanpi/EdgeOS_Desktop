<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">让 AI 搭建 V853 LVGL 9 独立工程</title>
  <desc id="desc">把 LVGL 9 源码、Tina SDK 和板卡信息交给 AI，回答几个问题后，只在 v853-port 目录创建工程并生成 ARM 程序。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FBFF"/><stop offset="1" stop-color="#F2F8F4"/></linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2463A9"/><stop offset="1" stop-color="#7154B3"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#244767" flood-opacity="0.13"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6686AA"/></marker>
    <style>
      .cn{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}
      .mono{font-family:Consolas,"SFMono-Regular",monospace}
      .head{font:700 21px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#173D65}
      .sub{font:15px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#60758C}
      .code{font:700 15px Consolas,"SFMono-Regular",monospace;fill:#2463A9}
    </style>
  </defs>
  <rect width="1200" height="590" rx="28" fill="url(#bg)"/>
  <text x="55" y="58" class="cn" font-size="30" font-weight="700" fill="#153A62">把资料交给 AI，让它搭建独立工程</text>
  <text x="55" y="94" class="cn" font-size="18" fill="#60758C">准备好源码、SDK 和板卡信息，剩下的交给 AI。</text>

  <path d="M320 177H395" stroke="#6686AA" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M320 305H395" stroke="#6686AA" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M320 433H395" stroke="#6686AA" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M730 305H815" stroke="#6686AA" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="45" y="130" width="275" height="94" rx="18" fill="#FFFFFF" stroke="#BCD3EA" stroke-width="2"/>
    <text x="182" y="166" class="head" text-anchor="middle">LVGL 9 源码</text>
    <text x="182" y="198" class="code" text-anchor="middle">c210a4e... · 只读</text>

    <rect x="45" y="258" width="275" height="94" rx="18" fill="#FFFFFF" stroke="#CDBEEB" stroke-width="2"/>
    <text x="182" y="294" class="head" text-anchor="middle">V853 Tina SDK</text>
    <text x="182" y="326" class="sub" text-anchor="middle">交叉编译工具 · 只读</text>

    <rect x="45" y="386" width="275" height="94" rx="18" fill="#FFFFFF" stroke="#9DD2B4" stroke-width="2"/>
    <text x="182" y="422" class="head" text-anchor="middle">板卡实测</text>
    <text x="182" y="454" class="code" text-anchor="middle">fb0 · 480×800 · ft6336</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="395" y="165" width="335" height="280" rx="26" fill="url(#agent)"/>
    <circle cx="562" cy="222" r="33" fill="#FFFFFF" opacity="0.18"/>
    <path d="M548 222H576M562 208V236" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <text x="562" y="285" class="cn" font-size="25" font-weight="700" text-anchor="middle" fill="#FFFFFF">AI Agent</text>
    <rect x="445" y="315" width="235" height="43" rx="12" fill="#153A62" opacity="0.55"/>
    <text x="562" y="343" class="cn" font-size="17" font-weight="700" text-anchor="middle" fill="#FFFFFF">查看目录 → 提问确认</text>
    <rect x="445" y="370" width="235" height="43" rx="12" fill="#153A62" opacity="0.55"/>
    <text x="562" y="398" class="cn" font-size="17" font-weight="700" text-anchor="middle" fill="#FFFFFF">创建工程 → 交叉编译</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="815" y="145" width="340" height="320" rx="24" fill="#EAF8F0" stroke="#8AC5A4" stroke-width="2"/>
    <circle cx="865" cy="195" r="24" fill="#21825C"/>
    <path d="M854 195L862 203L878 186" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1000" y="204" class="head" text-anchor="middle" fill="#226247">v853-port</text>
    <rect x="860" y="240" width="250" height="42" rx="11" fill="#FFFFFF"/><text x="985" y="267" class="code" text-anchor="middle">lv_conf.h</text>
    <rect x="860" y="295" width="250" height="42" rx="11" fill="#FFFFFF"/><text x="985" y="322" class="code" text-anchor="middle">Makefile + 显示/触摸</text>
    <rect x="860" y="350" width="250" height="42" rx="11" fill="#FFFFFF"/><text x="985" y="377" class="code" text-anchor="middle">ARM 可执行文件</text>
    <text x="985" y="429" class="sub" text-anchor="middle">生成程序 ≠ 已通过板端验证</text>
  </g>

  <rect x="210" y="520" width="780" height="42" rx="14" fill="#FFF0F0" stroke="#E5B4B4"/>
  <text x="600" y="548" class="cn" font-size="17" text-anchor="middle" fill="#7B4141">只修改新建的 v853-port，不改原来的 LVGL 和 Tina SDK。</text>
</svg>
