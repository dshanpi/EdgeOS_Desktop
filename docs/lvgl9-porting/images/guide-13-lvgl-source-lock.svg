<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">获取并固定 LVGL 9 源码</title>
  <desc id="desc">从 LVGL 官方仓库拉取 release v9.4 分支，在 Ubuntu 虚拟机中固定到课程指定 commit，并区分 Tina 内置版本与 EdgeOS 补丁版本。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FBFF"/><stop offset="1" stop-color="#EEF6FF"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#244767" flood-opacity="0.13"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6686AA"/></marker>
    <style>
      .cn{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}
      .mono{font-family:Consolas,"SFMono-Regular",monospace}
      .head{font:700 22px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#173D65}
      .sub{font:16px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#60758C}
      .code{font:700 16px Consolas,"SFMono-Regular",monospace;fill:#2463A9}
    </style>
  </defs>
  <rect width="1200" height="520" rx="28" fill="url(#bg)"/>
  <text x="55" y="58" class="cn" font-size="30" font-weight="700" fill="#153A62">Part 2 第一步：把 LVGL 9 源码固定住</text>
  <text x="55" y="94" class="cn" font-size="18" fill="#60758C">分支会继续前进，固定 commit 才能让每位学员得到同一份源码。</text>

  <path d="M345 245H420" stroke="#6686AA" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M780 245H850" stroke="#6686AA" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="45" y="155" width="300" height="180" rx="22" fill="#FFFFFF" stroke="#BCD3EA" stroke-width="2"/>
    <text x="195" y="201" class="head" text-anchor="middle">LVGL 官方仓库</text>
    <text x="195" y="244" class="code" text-anchor="middle">github.com/lvgl/lvgl</text>
    <rect x="95" y="272" width="200" height="38" rx="11" fill="#EEF5FF"/>
    <text x="195" y="297" class="mono" font-size="16" font-weight="700" text-anchor="middle" fill="#2463A9">release/v9.4</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="420" y="145" width="360" height="200" rx="22" fill="#2463A9"/>
    <text x="600" y="194" class="cn" font-size="22" font-weight="700" text-anchor="middle" fill="#FFFFFF">拉取到 Ubuntu 虚拟机</text>
    <rect x="465" y="220" width="270" height="48" rx="12" fill="#153A62" opacity="0.72"/>
    <text x="600" y="251" class="mono" font-size="18" font-weight="700" text-anchor="middle" fill="#FFFFFF">git clone</text>
    <text x="600" y="304" class="mono" font-size="15" text-anchor="middle" fill="#DCEBFA">~/100ask-course/lvgl9/lvgl</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="850" y="155" width="305" height="180" rx="22" fill="#EAF8F0" stroke="#8AC5A4" stroke-width="2"/>
    <circle cx="895" cy="199" r="23" fill="#21825C"/>
    <path d="M884 199L892 207L908 190" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1012" y="207" class="head" text-anchor="middle" fill="#226247">固定课程版本</text>
    <text x="1002" y="252" class="code" text-anchor="middle" fill="#21825C">c210a4e...</text>
    <text x="1002" y="294" class="cn" font-size="17" text-anchor="middle" fill="#35715A">LVGL v9.4.0</text>
  </g>

  <g>
    <rect x="85" y="395" width="280" height="70" rx="17" fill="#F2F4F7" stroke="#C8CED6"/>
    <text x="225" y="423" class="cn" font-size="16" text-anchor="middle" fill="#586675">Tina 内置源码</text>
    <text x="225" y="450" class="mono" font-size="17" font-weight="700" text-anchor="middle" fill="#586675">LVGL 8.3.1 · 运行基线</text>

    <rect x="460" y="395" width="280" height="70" rx="17" fill="#EAF8F0" stroke="#8AC5A4"/>
    <text x="600" y="423" class="cn" font-size="16" text-anchor="middle" fill="#35715A">本节使用</text>
    <text x="600" y="450" class="mono" font-size="17" font-weight="700" text-anchor="middle" fill="#21825C">c210a4e... · 官方基线</text>

    <rect x="835" y="395" width="280" height="70" rx="17" fill="#FFF6E8" stroke="#E7C168"/>
    <text x="975" y="423" class="cn" font-size="16" text-anchor="middle" fill="#795B19">后续再处理</text>
    <text x="975" y="450" class="mono" font-size="17" font-weight="700" text-anchor="middle" fill="#A06A00">9157e45... · EdgeOS 补丁</text>
  </g>
</svg>
