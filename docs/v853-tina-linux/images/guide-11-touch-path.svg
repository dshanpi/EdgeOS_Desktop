<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Touch 外设验证的数据链路</title>
  <desc id="desc">触摸屏数据经 Linux input 子系统进入实际 event 节点，再由测试工具观察，实测参数留给后续 LVGL evdev 接入。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FBFF"/><stop offset="1" stop-color="#F3F0FF"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#3A315A" flood-opacity="0.12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7D6BAA"/></marker>
    <style>.cn{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.mono{font-family:Consolas,"SFMono-Regular",monospace}.head{font:700 21px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#2E3F67}.sub{font:16px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#65718A}.code{font:700 18px Consolas,"SFMono-Regular",monospace;fill:#6C50A4}</style>
  </defs>
  <rect width="1200" height="440" rx="28" fill="url(#bg)"/>
  <text x="55" y="58" class="cn" font-size="30" font-weight="700" fill="#2E3F67">触摸数据能走到哪里？</text>
  <text x="55" y="94" class="cn" font-size="18" fill="#68738C">本节验证到 Linux event 节点为止，暂时不接入 LVGL。</text>
  <path d="M255 227H305 M535 227H585 M815 227H865" stroke="#7D6BAA" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="40" y="145" width="215" height="165" rx="20" fill="#6C50A4"/>
    <text x="147" y="211" class="cn" font-size="21" font-weight="700" text-anchor="middle" fill="#FFFFFF">触摸屏</text>
    <text x="147" y="252" class="cn" font-size="18" text-anchor="middle" fill="#EEE8FA">点击 · 拖动 · 松开</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="295" y="145" width="240" height="165" rx="20" fill="#FFFFFF" stroke="#D8CEF0" stroke-width="2"/>
    <text x="415" y="205" class="head" text-anchor="middle">Linux input</text>
    <text x="415" y="249" class="sub" text-anchor="middle">默认驱动已加载</text>
    <text x="415" y="280" class="sub" text-anchor="middle">本节不改驱动</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="575" y="145" width="240" height="165" rx="20" fill="#F2EEFC" stroke="#B8A7DD" stroke-width="2"/>
    <text x="695" y="202" class="head" text-anchor="middle">实际设备节点</text>
    <text x="695" y="247" class="code" text-anchor="middle">/dev/input/eventN</text>
    <text x="695" y="279" class="sub" text-anchor="middle">每次按名称确认</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="855" y="130" width="305" height="195" rx="20" fill="#EAF8F0" stroke="#8AC5A4" stroke-width="2"/>
    <text x="1007" y="177" class="head" text-anchor="middle" fill="#226247">观察并记录</text>
    <text x="1007" y="219" class="code" text-anchor="middle">evtest</text>
    <text x="1007" y="258" class="cn" font-size="17" text-anchor="middle" fill="#35715A">轴代码 · 范围 · 方向</text>
    <text x="1007" y="293" class="sub" text-anchor="middle">后续交给 LVGL evdev</text>
  </g>
  <rect x="350" y="365" width="500" height="42" rx="14" fill="#FFF8E8" stroke="#E7C168"/>
  <text x="600" y="393" class="cn" font-size="17" text-anchor="middle" fill="#795B19">event 编号可能变化，设备名称和实测数据更可靠。</text>
</svg>
