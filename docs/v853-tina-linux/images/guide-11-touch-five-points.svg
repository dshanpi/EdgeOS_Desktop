<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">触摸屏五点与拖动验证</title>
  <desc id="desc">在 LVGL 示例界面依次点击屏幕四角与中心，再从左向右、从上向下拖动控件，确认触摸响应是否完整、跟手。</desc>
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EAF3FF"/><stop offset="1" stop-color="#F2EEFC"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#29435F" flood-opacity="0.16"/></filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2463A9"/></marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7551A6"/></marker>
    <style>.cn{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.mono{font-family:Consolas,"SFMono-Regular",monospace}.label{font:700 18px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#284866}</style>
  </defs>
  <rect width="1200" height="620" rx="28" fill="#F8FBFF"/>
  <text x="55" y="58" class="cn" font-size="30" font-weight="700" fill="#153A62">五个位置 + 两次拖动</text>
  <text x="55" y="94" class="cn" font-size="18" fill="#60758C">每次操作都看界面反馈，不需要先理解触摸坐标。</text>
  <g filter="url(#shadow)">
    <rect x="180" y="130" width="840" height="420" rx="30" fill="#22364A"/>
    <rect x="215" y="165" width="770" height="350" rx="14" fill="url(#screen)"/>
  </g>
  <g>
    <circle cx="265" cy="215" r="23" fill="#2463A9"/><text x="265" y="222" class="cn" font-size="19" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text>
    <text x="300" y="221" class="label">左上</text>
    <circle cx="935" cy="215" r="23" fill="#2463A9"/><text x="935" y="222" class="cn" font-size="19" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text>
    <text x="900" y="221" class="label" text-anchor="end">右上</text>
    <circle cx="265" cy="465" r="23" fill="#2463A9"/><text x="265" y="472" class="cn" font-size="19" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text>
    <text x="300" y="471" class="label">左下</text>
    <circle cx="935" cy="465" r="23" fill="#2463A9"/><text x="935" y="472" class="cn" font-size="19" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text>
    <text x="900" y="471" class="label" text-anchor="end">右下</text>
    <circle cx="600" cy="340" r="27" fill="#21825C"/><text x="600" y="348" class="cn" font-size="20" font-weight="700" text-anchor="middle" fill="#FFFFFF">5</text>
    <text x="600" y="389" class="label" text-anchor="middle" fill="#226247">中心</text>
  </g>
  <path d="M335 285H830" stroke="#2463A9" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
  <text x="582" y="272" class="cn" font-size="17" font-weight="700" text-anchor="middle" fill="#2463A9">左 → 右：观察控件是否跟手</text>
  <path d="M710 225V438" stroke="#7551A6" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowPurple)"/>
  <text x="735" y="335" class="cn" font-size="17" font-weight="700" fill="#7551A6">上 → 下拖动</text>
  <rect x="360" y="575" width="480" height="34" rx="12" fill="#FFF8E8" stroke="#E7C168"/>
  <text x="600" y="598" class="cn" font-size="16" text-anchor="middle" fill="#795B19">五个位置都能响应、拖动跟手，即可通过触摸验证。</text>
</svg>
