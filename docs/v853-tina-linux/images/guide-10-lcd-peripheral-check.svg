<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">LCD 外设验证的数据链路</title>
  <desc id="desc">默认固件通过 Linux 显示驱动和 framebuffer 驱动 LCD，本节只观察画面并记录节点、分辨率、像素格式和方向。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FBFF"/><stop offset="1" stop-color="#EEF6FF"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#244767" flood-opacity="0.12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#668BB4"/></marker>
    <style>.cn{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.mono{font-family:Consolas,"SFMono-Regular",monospace}.head{font:700 21px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1C4068}.sub{font:16px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#5A7086}.code{font:700 18px Consolas,"SFMono-Regular",monospace;fill:#2463A9}</style>
  </defs>
  <rect width="1200" height="470" rx="28" fill="url(#bg)"/>
  <text x="55" y="58" class="cn" font-size="30" font-weight="700" fill="#153A62">默认固件已适配，本节只做验证</text>
  <text x="55" y="94" class="cn" font-size="18" fill="#60758C">先看画面，再读参数；基线不通过时不要进入 LVGL 排错。</text>
  <path d="M280 230H325 M555 230H600 M830 230H875" stroke="#668BB4" stroke-width="4" marker-end="url(#arrow)"/>
  <g filter="url(#shadow)">
    <rect x="40" y="150" width="240" height="160" rx="20" fill="#2463A9"/>
    <text x="160" y="209" class="cn" font-size="21" font-weight="700" text-anchor="middle" fill="#FFFFFF">默认固件</text>
    <text x="160" y="250" class="mono" font-size="19" font-weight="700" text-anchor="middle" fill="#FFFFFF">V853 Tina Linux</text>
    <text x="160" y="282" class="cn" font-size="16" text-anchor="middle" fill="#DCEBFA">无需重新适配驱动</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="315" y="150" width="240" height="160" rx="20" fill="#FFFFFF" stroke="#C9DBEE" stroke-width="2"/>
    <text x="435" y="202" class="head" text-anchor="middle">Linux 显示链路</text>
    <text x="435" y="245" class="code" text-anchor="middle">/dev/fbX</text>
    <text x="435" y="280" class="sub" text-anchor="middle">fbdev → LCD</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="590" y="150" width="240" height="160" rx="20" fill="#EAF8F0" stroke="#8AC5A4" stroke-width="2"/>
    <text x="710" y="202" class="head" text-anchor="middle" fill="#226247">肉眼验收</text>
    <text x="710" y="243" class="cn" font-size="18" text-anchor="middle" fill="#35715A">背光 · 整屏 · 颜色</text>
    <text x="710" y="278" class="cn" font-size="18" text-anchor="middle" fill="#35715A">方向 · 稳定性</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="865" y="135" width="295" height="190" rx="20" fill="#FFF8E8" stroke="#E7C168" stroke-width="2"/>
    <text x="1012" y="181" class="head" text-anchor="middle" fill="#7B570B">参数卡</text>
    <text x="1012" y="221" class="code" text-anchor="middle">node · geometry · rgba</text>
    <text x="1012" y="260" class="code" text-anchor="middle">BPP · stride · rotation</text>
    <text x="1012" y="296" class="sub" text-anchor="middle">交给后续 LVGL 章节</text>
  </g>
  <rect x="315" y="370" width="570" height="44" rx="14" fill="#FFF0F0" stroke="#E5B4B4"/>
  <circle cx="348" cy="392" r="13" fill="#C94B4B"/><path d="M343 387L353 397M353 387L343 397" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <text x="374" y="399" class="cn" font-size="17" fill="#7B4141">不写 framebuffer，不改 DTS，不重新编译 LCD 驱动。</text>
</svg>
