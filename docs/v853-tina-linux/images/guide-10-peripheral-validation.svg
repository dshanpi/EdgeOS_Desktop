<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">使用一个 LVGL 示例同时验证 LCD 与 Touch</title>
  <desc id="desc">通过 USB-Enhanced-SERIAL-A CH342 登录 V853，运行 lv_examples 0，程序同时访问 framebuffer 和触摸输入设备，再由学员观察画面并操作触摸屏。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7FBFF"/><stop offset="1" stop-color="#F2F8F4"/></linearGradient>
    <linearGradient id="app" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2463A9"/><stop offset="1" stop-color="#347FBF"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#23425F" flood-opacity="0.14"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6284A3"/></marker>
    <style>
      .cn{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}
      .mono{font-family:Consolas,"SFMono-Regular",monospace}
      .head{font:700 22px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#173A5D}
      .sub{font:16px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#587087}
      .code{font:700 18px Consolas,"SFMono-Regular",monospace;fill:#2463A9}
    </style>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <text x="55" y="58" class="cn" font-size="30" font-weight="700" fill="#153A62">一个命令，同时验证两条外设链路</text>
  <text x="55" y="94" class="cn" font-size="18" fill="#60758C">Agent 看串口与设备节点，你用眼睛看画面、用手指测触摸。</text>

  <path d="M300 280H365" stroke="#6284A3" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M675 280H715 Q745 280 745 250V186 Q745 156 775 156H805" fill="none" stroke="#6284A3" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M675 280H715 Q745 280 745 310V374 Q745 404 775 404H805" fill="none" stroke="#6284A3" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="45" y="190" width="255" height="180" rx="22" fill="#FFFFFF" stroke="#C9DBEE" stroke-width="2"/>
    <circle cx="92" cy="235" r="23" fill="#EAF3FF"/>
    <path d="M83 235H101M92 226V244" stroke="#2463A9" stroke-width="3" stroke-linecap="round"/>
    <text x="172" y="241" class="head" text-anchor="middle">连接开发板</text>
    <text x="172" y="282" class="mono" font-size="14" font-weight="700" text-anchor="middle" fill="#2463A9">USB-Enhanced-SERIAL-A</text>
    <text x="172" y="311" class="code" text-anchor="middle">CH342 · 115200</text>
    <text x="172" y="344" class="mono" font-size="15" text-anchor="middle" fill="#587087">root@TinaLinux:/#</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="365" y="175" width="310" height="210" rx="24" fill="url(#app)"/>
    <text x="520" y="235" class="cn" font-size="23" font-weight="700" text-anchor="middle" fill="#FFFFFF">启动综合示例</text>
    <rect x="405" y="263" width="230" height="48" rx="12" fill="#153A62" opacity="0.72"/>
    <text x="520" y="294" class="mono" font-size="20" font-weight="700" text-anchor="middle" fill="#FFFFFF">lv_examples 0</text>
    <text x="520" y="344" class="cn" font-size="16" text-anchor="middle" fill="#DCEBFA">程序运行时终端不返回提示符</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="805" y="95" width="350" height="170" rx="22" fill="#EAF8F0" stroke="#8AC5A4" stroke-width="2"/>
    <circle cx="855" cy="142" r="24" fill="#21825C"/>
    <path d="M844 142L852 150L868 133" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="980" y="150" class="head" text-anchor="middle" fill="#226247">LCD 显示</text>
    <text x="980" y="194" class="code" text-anchor="middle">/dev/fb0 · 480×800</text>
    <text x="980" y="230" class="sub" text-anchor="middle">看整屏、颜色、方向与稳定性</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="805" y="315" width="350" height="170" rx="22" fill="#F2EEFC" stroke="#B8A7DD" stroke-width="2"/>
    <circle cx="855" cy="362" r="24" fill="#7551A6"/>
    <path d="M844 362L852 370L868 353" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="980" y="370" class="head" text-anchor="middle" fill="#554078">Touch 输入</text>
    <text x="980" y="414" class="code" text-anchor="middle" fill="#6C50A4">ft6336 · /dev/input/event3</text>
    <text x="980" y="450" class="sub" text-anchor="middle">点五个位置，再拖动一个控件</text>
  </g>

  <rect x="250" y="505" width="700" height="38" rx="13" fill="#FFF8E8" stroke="#E7C168"/>
  <text x="600" y="531" class="cn" font-size="16" text-anchor="middle" fill="#795B19">排线只在断电后检查；本节只验证，不修改驱动和设备树。</text>
</svg>
