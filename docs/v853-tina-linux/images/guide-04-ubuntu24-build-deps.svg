<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">Ubuntu 24.04 安装 Tina SDK 编译依赖的流程</title>
  <desc id="desc">依次启用 i386、更新软件索引、安装编译依赖并检查 GCC、Make、Python 和 32 位兼容库。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FBFF"/><stop offset="1" stop-color="#EEF6FF"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#244767" flood-opacity="0.12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7393BE"/></marker>
    <style>.cn{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif}.mono{font-family:Consolas,"SFMono-Regular",monospace}.num{font:700 20px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#fff}.head{font:700 22px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1C4068}.code{font:700 17px Consolas,"SFMono-Regular",monospace;fill:#2463A9}.hint{font:17px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#5A7086}</style>
  </defs>
  <rect width="1200" height="450" rx="28" fill="url(#bg)"/>
  <text x="56" y="60" class="cn" font-size="30" font-weight="700" fill="#153A62">Ubuntu 24.04：4 步准备编译环境</text>
  <text x="56" y="94" class="cn" font-size="18" fill="#60758C">使用新版包名，同时照顾 SDK 中的 32 位打包工具。</text>

  <path d="M280 224H326" stroke="#7393BE" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M570 224H616" stroke="#7393BE" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M860 224H906" stroke="#7393BE" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="40" y="135" width="240" height="178" rx="20" fill="#FFFFFF" stroke="#D7E4F2" stroke-width="2"/>
    <circle cx="78" cy="175" r="23" fill="#2463A9"/><text x="72" y="182" class="num">1</text>
    <text x="112" y="182" class="head">开启 32 位</text>
    <rect x="62" y="211" width="196" height="48" rx="10" fill="#EDF5FF"/>
    <text x="92" y="241" class="code">add-architecture</text>
    <text x="62" y="291" class="hint">架构名称：i386</text>

    <rect x="330" y="135" width="240" height="178" rx="20" fill="#FFFFFF" stroke="#D7E4F2" stroke-width="2"/>
    <circle cx="368" cy="175" r="23" fill="#2463A9"/><text x="362" y="182" class="num">2</text>
    <text x="402" y="182" class="head">更新索引</text>
    <rect x="352" y="211" width="196" height="48" rx="10" fill="#EDF5FF"/>
    <text x="395" y="241" class="code">sudo apt update</text>
    <text x="352" y="291" class="hint">没有 E: 错误再继续</text>

    <rect x="620" y="135" width="240" height="178" rx="20" fill="#FFF9EE" stroke="#E8C46F" stroke-width="2"/>
    <circle cx="658" cy="175" r="23" fill="#D88612"/><text x="652" y="182" class="num">3</text>
    <text x="692" y="182" class="head">安装依赖</text>
    <rect x="642" y="211" width="196" height="48" rx="10" fill="#FFF0D5"/>
    <text x="680" y="241" class="code" fill="#A15C00">sudo apt install</text>
    <text x="642" y="291" class="hint">编译工具 + 32 位库</text>

    <rect x="910" y="135" width="250" height="178" rx="20" fill="#FFFFFF" stroke="#A7D7BC" stroke-width="2"/>
    <circle cx="948" cy="175" r="23" fill="#21825C"/><text x="942" y="182" class="num">4</text>
    <text x="982" y="182" class="head">检查结果</text>
    <text x="935" y="224" class="code" fill="#187451">GCC + Make</text>
    <text x="935" y="255" class="code" fill="#187451">Python 3</text>
    <text x="935" y="286" class="code" fill="#187451">i386 : OK</text>
  </g>

  <rect x="185" y="354" width="830" height="58" rx="15" fill="#FFF0F0" stroke="#E5B4B4"/>
  <circle cx="222" cy="383" r="17" fill="#C94B4B"/>
  <path d="M215 376l14 14M229 376l-14 14" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="254" y="390" class="cn" font-size="18" fill="#7B4141">不要再用旧包名：git-core、libncurses5-dev、lib32ncurses5</text>
</svg>
